name: static-validation

on:
  pull_request:
  push:
    branches:
      - claude/erpnext-portal-doctypes-ek0pwa
      - 'repair/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate repository structure and secrets
        run: python scripts/validate_repo.py
      - name: Compile Python
        run: python -m compileall -q scripts *.py
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          find portal livingorg-os livingorg-os-v2 livingorg-flow-studio-v3 -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check
