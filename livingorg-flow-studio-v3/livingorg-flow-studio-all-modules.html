<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1420">
  <title>LivingOrg OS · Revisión de módulos</title>
  <style>
    :root {
      --navy-950: #08111d;
      --navy-900: #0c1725;
      --navy-850: #101d2d;
      --navy-800: #152437;
      --paper: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f8fafb;
      --line: #e3e8ee;
      --line-strong: #cbd4df;
      --text: #172231;
      --muted: #667487;
      --muted-2: #8b98a8;
      --brand: #f26b1f;
      --brand-strong: #c75113;
      --brand-soft: rgba(242, 107, 31, .11);
      --success: #19966a;
      --warning: #bd7b1e;
      --danger: #cb4c4c;
      --blue: #2d89aa;
      --purple: #6d5ae6;
      --shadow-1: 0 1px 3px rgba(18, 30, 45, .06), 0 8px 22px rgba(18, 30, 45, .05);
      --shadow-2: 0 20px 50px rgba(11, 20, 32, .15);
      --sidebar: 278px;
      --topbar: 64px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    [data-theme="dark"] {
      --paper: #0c1420;
      --surface: #111d2d;
      --surface-2: #162437;
      --line: #26384d;
      --line-strong: #3c5067;
      --text: #edf2f7;
      --muted: #adbac9;
      --muted-2: #8190a2;
      --brand-soft: rgba(242, 107, 31, .16);
      --shadow-1: 0 1px 3px rgba(0, 0, 0, .18), 0 12px 28px rgba(0, 0, 0, .12);
      --shadow-2: 0 20px 55px rgba(0, 0, 0, .36);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { min-height: 100dvh; overflow: hidden; background: var(--paper); color: var(--text); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(242, 107, 31, .28); outline-offset: 2px; }
    h1, h2, h3, p { margin: 0; }
    .app { min-height: 100dvh; display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); overflow: hidden; }
    .sidebar { min-width: 0; position: relative; z-index: 20; display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid rgba(255,255,255,.08); background: radial-gradient(100% 34% at 50% 0, rgba(54, 101, 149, .27), transparent 70%), var(--navy-900); color: #d7e0ea; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 17px 16px 15px; }
    .brand-mark { width: 40px; height: 40px; display: grid; place-items: center; flex: 0 0 40px; border-radius: 12px; background: linear-gradient(145deg, #ffad5c, var(--brand) 58%, #c94b0e); box-shadow: 0 9px 20px rgba(242, 107, 31, .25); color: white; font-size: 25px; font-weight: 800; }
    .brand-copy { min-width: 0; }
    .brand-copy strong, .brand-copy small { display: block; white-space: nowrap; }
    .brand-copy strong { color: white; font-size: 15px; letter-spacing: .04em; line-height: 1.1; }
    .brand-copy strong span { color: #ffad5c; }
    .brand-copy small { margin-top: 5px; color: #8495a9; font-size: 9.5px; }
    .nav { min-height: 0; flex: 1; overflow: auto; padding: 4px 10px 15px; scrollbar-width: thin; scrollbar-color: #334861 transparent; }
    .nav-group { margin-top: 18px; }
    .nav-group:first-child { margin-top: 3px; }
    .nav-label { padding: 6px 11px; color: #8495a9; font-size: 9px; font-weight: 850; letter-spacing: .16em; text-transform: uppercase; }
    .nav-button { width: 100%; min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #c6d2df; text-align: left; transition: background .16s ease, color .16s ease, transform .16s ease; }
    .nav-button:hover { background: rgba(255,255,255,.065); color: white; }
    .nav-button:active { transform: translateY(1px); }
    .nav-button.is-active { background: linear-gradient(90deg, rgba(242,107,31,.22), rgba(242,107,31,.06)); box-shadow: inset 3px 0 0 var(--brand); color: white; font-weight: 750; }
    .nav-icon { width: 28px; height: 28px; display: grid; place-items: center; flex: 0 0 28px; border-radius: 8px; color: #94a8bd; font-size: 16px; }
    .nav-button:hover .nav-icon, .nav-button.is-active .nav-icon { background: rgba(242,107,31,.13); color: #ffad5c; }
    .nav-count { min-width: 21px; margin-left: auto; padding: 2px 5px; border: 1px solid rgba(255,255,255,.1); border-radius: 99px; background: rgba(255,255,255,.05); color: #98aabd; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; text-align: center; }
    .nav-count.alert { border-color: rgba(242,107,31,.35); background: rgba(242,107,31,.15); color: #ffb36e; }
    .sidebar-foot { padding: 12px; border-top: 1px solid rgba(255,255,255,.08); }
    .workspace { width: 100%; display: flex; align-items: center; gap: 9px; padding: 8px; border: 0; border-radius: 10px; background: transparent; color: #d6e0ea; text-align: left; }
    .workspace:hover { background: rgba(255,255,255,.06); }
    .workspace-avatar { width: 31px; height: 31px; display: grid; place-items: center; flex: 0 0 31px; border-radius: 9px; background: linear-gradient(145deg, #2d89aa, #6d5ae6); color: white; font-size: 10px; font-weight: 800; }
    .workspace-copy { min-width: 0; flex: 1; }
    .workspace-copy strong, .workspace-copy small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .workspace-copy strong { font-size: 11px; }
    .workspace-copy small { margin-top: 2px; color: #8495a9; font-size: 9.5px; }
    .main { min-width: 0; min-height: 100dvh; display: grid; grid-template-rows: var(--topbar) minmax(0, 1fr); overflow: hidden; }
    .topbar { min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0 17px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 91%, transparent); backdrop-filter: blur(13px); }
    .menu-button { display: none; }
    .search { width: min(340px, 38vw); height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--muted-2); }
    .search input { min-width: 0; flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 12px; }
    .search kbd { padding: 2px 5px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted-2); font-size: 9px; }
    .topbar-spacer { flex: 1; }
    .top-button, .avatar { width: 36px; height: 36px; display: grid; place-items: center; flex: 0 0 36px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--muted); }
    .top-button:hover { border-color: rgba(242,107,31,.45); background: var(--brand-soft); color: var(--brand-strong); }
    .avatar { border: 0; background: linear-gradient(145deg, #2d89aa, #6d5ae6); color: white; font-size: 11px; font-weight: 800; }
    .workspace-pill { height: 36px; display: flex; align-items: center; gap: 7px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 700; white-space: nowrap; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px rgba(25,150,106,.13); }
    .content { min-height: 0; overflow: hidden; }
    .view { height: 100%; overflow: auto; padding: 27px 31px 55px; background: var(--paper); scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
    .view-inner { width: min(100%, 1380px); margin: 0 auto; }
    .module-head, .process-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 23px; margin-bottom: 23px; }
    .eyebrow { display: block; color: var(--brand-strong); font-size: 9px; font-weight: 850; letter-spacing: .15em; line-height: 1.2; text-transform: uppercase; }
    .module-title, .process-title { display: flex; align-items: center; gap: 11px; margin-top: 7px; color: var(--text); font-size: clamp(24px, 3vw, 35px); font-weight: 800; letter-spacing: -.045em; line-height: 1.04; }
    .title-icon { width: 39px; height: 39px; display: grid; place-items: center; flex: 0 0 39px; border: 1px solid rgba(242,107,31,.35); border-radius: 11px; background: var(--brand-soft); color: var(--brand); font-size: 21px; }
    .module-description, .process-description { max-width: 730px; margin-top: 10px; color: var(--muted); font-size: 13px; }
    .head-actions { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; padding-top: 5px; }
    .code-pill, .record-count, .score { display: inline-flex; align-items: center; min-height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); color: var(--muted); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; white-space: nowrap; }
    .button { min-height: 35px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 750; }
    .button:hover { border-color: rgba(242,107,31,.5); background: var(--brand-soft); color: var(--brand-strong); }
    .button.primary { border-color: var(--brand); background: var(--brand); color: white; box-shadow: 0 6px 15px rgba(242,107,31,.18); }
    .button.primary:hover { border-color: #d45712; background: #d45712; color: white; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
    .stat { min-height: 125px; display: flex; flex-direction: column; justify-content: center; padding: 15px 16px 15px 18px; position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow-1); }
    .stat::before { width: 5px; position: absolute; inset: 0 auto 0 0; background: var(--brand); content: ""; }
    .stat[data-tone="good"]::before { background: var(--success); }
    .stat[data-tone="warn"]::before { background: var(--warning); }
    .stat[data-tone="danger"]::before { background: var(--danger); }
    .stat[data-tone="blue"]::before { background: var(--blue); }
    .stat[data-tone="ai"]::before { background: var(--purple); }
    .stat-label { color: var(--muted-2); font-size: 9.5px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    .stat-value { margin-top: 5px; color: var(--text); font-size: 29px; font-weight: 800; letter-spacing: -.05em; line-height: 1; }
    .stat small { margin-top: 8px; color: var(--muted); font-size: 10.5px; line-height: 1.35; }
    .card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-1); }
    .section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 17px 18px 14px; border-bottom: 1px solid var(--line); }
    .section-kicker { display: block; color: var(--brand-strong); font-size: 9px; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }
    .section-head h2 { margin-top: 4px; color: var(--text); font-size: 16px; letter-spacing: -.02em; }
    .record-count { min-height: 25px; padding-inline: 8px; font-size: 9px; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; min-width: 740px; border-collapse: collapse; font-size: 11px; }
    th { padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); color: var(--muted-2); font-size: 9px; font-weight: 850; letter-spacing: .1em; text-align: left; text-transform: uppercase; white-space: nowrap; }
    td { padding: 13px 14px; border-bottom: 1px solid var(--line); color: var(--muted); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: color-mix(in srgb, var(--brand-soft) 40%, transparent); }
    .code-link, .context-link { padding: 0; border: 0; background: transparent; color: var(--brand-strong); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; font-weight: 800; text-align: left; white-space: nowrap; }
    .code-link:hover, .context-link:hover { color: var(--brand); text-decoration: underline; text-underline-offset: 3px; }
    .state { display: inline-flex; align-items: center; min-height: 24px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface-2); color: var(--muted); font-size: 10px; font-weight: 750; white-space: nowrap; }
    .state::before { width: 6px; height: 6px; margin-right: 5px; border-radius: 50%; background: var(--muted-2); content: ""; }
    .state[data-tone="good"] { border-color: rgba(25,150,106,.25); background: rgba(25,150,106,.09); color: var(--success); }
    .state[data-tone="good"]::before { background: var(--success); }
    .state[data-tone="warn"] { border-color: rgba(189,123,30,.28); background: rgba(189,123,30,.1); color: var(--warning); }
    .state[data-tone="warn"]::before { background: var(--warning); }
    .state[data-tone="info"] { border-color: rgba(45,137,170,.26); background: rgba(45,137,170,.1); color: var(--blue); }
    .state[data-tone="info"]::before { background: var(--blue); }
    .block-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 17px; }
    .block { min-height: 185px; display: flex; flex-direction: column; padding: 16px; position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); }
    .block::after { width: 112px; height: 112px; position: absolute; top: -50px; right: -42px; border-radius: 50%; background: var(--brand-soft); content: ""; }
    .block[data-tone="blue"]::after { background: rgba(45,137,170,.12); }
    .block[data-tone="danger"]::after { background: rgba(203,76,76,.11); }
    .block[data-tone="warn"]::after { background: rgba(189,123,30,.12); }
    .block[data-tone="ai"]::after { background: rgba(109,90,230,.12); }
    .block-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: relative; z-index: 1; }
    .block-icon { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 9px; background: var(--brand-soft); color: var(--brand); font-size: 16px; }
    .block h3 { margin-top: 19px; color: var(--text); font-size: 15px; }
    .block p { margin-top: 7px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .inline-action { display: inline-flex; align-items: center; gap: 5px; align-self: flex-start; margin-top: auto; padding: 9px 0 0; border: 0; background: transparent; color: var(--brand-strong); font-size: 11px; font-weight: 800; }
    .inline-action:hover { color: var(--brand); }
    .lower-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, .65fr); gap: 12px; margin-top: 18px; }
    .process-strip { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; padding: 17px 18px 10px; }
    .process-strip span { padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--text); font-size: 10px; font-weight: 750; }
    .process-strip b { color: var(--brand); font-size: 15px; }
    .trace-copy { padding: 0 18px; color: var(--muted); font-size: 11px; }
    .context-links { display: flex; flex-wrap: wrap; gap: 7px; padding: 14px 18px 18px; }
    .context-link { padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-2); font-size: 9px; }
    .context-link:hover { border-color: rgba(242,107,31,.4); background: var(--brand-soft); text-decoration: none; }
    .live { display: inline-flex; align-items: center; gap: 6px; color: var(--success); font-size: 10px; font-weight: 800; }
    .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px rgba(25,150,106,.12); }
    .score { min-height: 25px; border-color: rgba(25,150,106,.25); background: rgba(25,150,106,.09); color: var(--success); font-weight: 800; }
    .check-list { display: grid; gap: 1px; padding: 8px 18px 12px; }
    .check-list > div { display: flex; align-items: flex-start; gap: 9px; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .check-list > div:last-child { border-bottom: 0; }
    .check-list > div > span { width: 19px; height: 19px; display: grid; place-items: center; flex: 0 0 19px; border-radius: 50%; background: rgba(25,150,106,.12); color: var(--success); font-size: 11px; font-weight: 850; }
    .check-list strong, .check-list small { display: block; }
    .check-list strong { color: var(--text); font-size: 11px; }
    .check-list small { margin-top: 2px; color: var(--muted-2); font-size: 10px; }
    .process-canvas { min-height: 560px; position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background-color: var(--surface); background-image: radial-gradient(var(--line-strong) .75px, transparent .75px); background-size: 22px 22px; box-shadow: var(--shadow-1); }
    .canvas-toolbar { min-height: 54px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 13px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 92%, transparent); }
    .toolbar-group { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
    .toolbar-button { min-height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); font-size: 10px; font-weight: 750; }
    .toolbar-button:hover { border-color: rgba(242,107,31,.45); background: var(--brand-soft); color: var(--brand-strong); }
    .toolbar-button.primary { border-color: rgba(242,107,31,.4); background: var(--brand-soft); color: var(--brand-strong); }
    .process-meta { display: flex; align-items: center; gap: 7px; color: var(--muted-2); font-size: 10px; }
    .process-meta b { color: var(--text); }
    .canvas-stage { min-height: 505px; display: flex; align-items: center; justify-content: center; padding: 35px 28px 45px; }
    .flow-stack { width: min(100%, 580px); display: flex; flex-direction: column; align-items: center; gap: 0; }
    .flow-node { width: min(100%, 315px); position: relative; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-1); }
    .flow-node::after { width: 2px; height: 22px; position: absolute; top: 100%; left: 50%; background: var(--line-strong); content: ""; }
    .flow-node:last-child::after, .flow-branch .flow-node::after { display: none; }
    .flow-node-head { display: flex; align-items: center; gap: 9px; padding: 10px 12px 7px; }
    .node-icon { width: 25px; height: 25px; display: grid; place-items: center; flex: 0 0 25px; border-radius: 8px; background: var(--brand-soft); color: var(--brand); font-size: 13px; font-weight: 800; }
    .flow-node[data-tone="green"] .node-icon { background: rgba(25,150,106,.11); color: var(--success); }
    .flow-node[data-tone="blue"] .node-icon { background: rgba(45,137,170,.11); color: var(--blue); }
    .flow-node[data-tone="purple"] .node-icon { background: rgba(109,90,230,.12); color: var(--purple); }
    .flow-node[data-tone="red"] .node-icon { background: rgba(203,76,76,.11); color: var(--danger); }
    .flow-node strong { color: var(--text); font-size: 12px; }
    .flow-node small { display: block; padding: 0 12px 11px; color: var(--muted); font-size: 10px; }
    .flow-branch { width: min(100%, 650px); display: grid; grid-template-columns: 1fr 1fr; gap: 58px; margin: 22px 0; position: relative; }
    .flow-branch::before { height: 2px; position: absolute; top: -11px; right: 25%; left: 25%; background: var(--line-strong); content: ""; }
    .flow-branch::after { width: 2px; height: 11px; position: absolute; top: -21px; left: 50%; background: var(--line-strong); content: ""; }
    .branch-label { position: absolute; top: -29px; left: 50%; transform: translateX(-50%); padding: 2px 6px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); color: var(--muted-2); font-size: 9px; }
    .toast { position: fixed; right: 20px; bottom: 22px; z-index: 70; max-width: 340px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow-2); color: var(--text); font-size: 11px; animation: toast-in .18s ease-out; }
    .capture-overlay { position: fixed; inset: 0; z-index: 60; display: flex; justify-content: flex-end; background: rgba(7, 16, 27, .48); opacity: 0; pointer-events: none; transition: opacity .18s ease; }
    .capture-overlay.is-open { opacity: 1; pointer-events: auto; }
    .capture-sheet { width: min(780px, 100%); height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; transform: translateX(30px); background: var(--surface); box-shadow: var(--shadow-2); transition: transform .22s ease; }
    .capture-overlay.is-open .capture-sheet { transform: none; }
    .capture-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 23px 25px 18px; border-bottom: 1px solid var(--line); background: linear-gradient(135deg, var(--surface), var(--surface-2)); }
    .capture-title { display: flex; align-items: center; gap: 10px; margin-top: 7px; color: var(--text); font-size: 23px; font-weight: 800; letter-spacing: -.035em; line-height: 1.05; }
    .capture-title-icon { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 34px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); font-size: 18px; }
    .capture-head p { max-width: 575px; margin-top: 9px; color: var(--muted); font-size: 11px; }
    .capture-close { width: 34px; height: 34px; flex: 0 0 34px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--muted); font-size: 20px; line-height: 1; }
    .capture-close:hover { border-color: rgba(242,107,31,.45); background: var(--brand-soft); color: var(--brand-strong); }
    .capture-body { overflow: auto; padding: 20px 25px 27px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
    .capture-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 13px; }

      window.addEventListener("keydown", event => { if (event.key === "Escape" && captureOverlay.classList.contains("is-open")) closeCaptureForm(); });
      document.getElementById("menuButton").addEventListener("click", () => app.classList.add("menu-open"));
      document.getElementById("scrim").addEventListener("click", () => app.classList.remove("menu-open"));
      document.getElementById("themeButton").addEventListener("click", () => { const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = next; try { localStorage.setItem("livingorg.theme", next); } catch (_) {} });
      document.getElementById("search").addEventListener("keydown", event => { if (event.key === "Enter") toast(`Búsqueda preparada: ${event.currentTarget.value || "todo"}`); });
      window.addEventListener("hashchange", route);
      try { if (localStorage.getItem("livingorg.theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (_) {}
      route();
    })();
  </script>
</body>
</html>
